<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doorbell Demo Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <h1>Doorbell Demo Lab</h1>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="toolbar-group" role="group" aria-label="Lab mode">
        <span class="toolbar-label">Mode</span>
        <button type="button" id="mode-demo" class="toolbar-btn active" aria-pressed="true">
          Demo
        </button>
        <button type="button" id="mode-lab" class="toolbar-btn" aria-pressed="false">
          Lab
        </button>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="toolbar-group" id="wire-colors" role="group" aria-label="Wire color">
        <span class="toolbar-label">Wire</span>
        <button
          type="button"
          id="wire-red"
          class="wire-swatch wire-red active"
          data-color="red"
          aria-label="Red wire"
          aria-pressed="true"
        ></button>
        <button
          type="button"
          id="wire-black"
          class="wire-swatch wire-black"
          data-color="black"
          aria-label="Black wire"
          aria-pressed="false"
        ></button>
        <button
          type="button"
          id="wire-blue"
          class="wire-swatch wire-blue"
          data-color="blue"
          aria-label="Blue wire"
          aria-pressed="false"
        ></button>
        <button
          type="button"
          id="wire-green"
          class="wire-swatch wire-green"
          data-color="green"
          aria-label="Green wire"
          aria-pressed="false"
        ></button>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="toolbar-group" role="group" aria-label="Circuit actions">
        <button type="button" id="btn-undo" class="toolbar-btn" disabled title="Undo (Ctrl/Cmd+Z)">
          Undo
        </button>
        <button type="button" id="btn-test" class="toolbar-btn">Test</button>
        <button type="button" id="btn-check" class="toolbar-btn" disabled>Check</button>
      </div>

      <p id="hint">
        Demo: Front has one sound; Rear and Side share the other. Lab: wire that mapping, then
        Check to grade.
      </p>
    </header>

    <div id="stage-wrap">
      <div id="container"></div>
    </div>

    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/wires.js"></script>
    <script src="js/circuit.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/grade.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
