<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Doorbell chime wiring diagram sketch">
  <rect width="640" height="400" fill="#f7f3ea"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" fill="#1c2430">Residential Doorbell / Chime</text>
  <text x="32" y="68" font-family="Georgia, serif" font-size="13" fill="#5a6573">Front owns chime - Rear and Side share</text>

  <rect x="48" y="110" width="130" height="160" rx="4" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="113" y="100" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#1c2430">Chime</text>
  <circle cx="178" cy="145" r="5" fill="#1c2430"/>
  <circle cx="178" cy="190" r="5" fill="#1c2430"/>
  <circle cx="178" cy="235" r="5" fill="#1c2430"/>
  <text x="160" y="149" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6573">Front</text>
  <text x="160" y="194" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6573">Rear</text>
  <text x="160" y="239" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6573">Trans</text>

  <rect x="280" y="120" width="70" height="50" rx="6" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="315" y="150" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#1c2430">Front</text>
  <rect x="280" y="195" width="70" height="50" rx="6" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="315" y="225" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#1c2430">Rear</text>
  <rect x="280" y="270" width="70" height="50" rx="6" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="315" y="300" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#1c2430">Side</text>

  <rect x="480" y="180" width="100" height="90" rx="4" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="530" y="170" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#1c2430">16V XFMR</text>
  <circle cx="480" cy="210" r="4.5" fill="#c62828"/>
  <circle cx="480" cy="245" r="4.5" fill="#1c2430"/>

  <path d="M178 145 H250 V145 H280" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M350 145 H400 V210 H480" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M178 190 H250 V220 H280" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M350 220 H400 V220" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M350 295 H420 V220" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
  <path d="M178 235 H450 V245 H480" fill="none" stroke="#1c2430" stroke-width="2.5" stroke-linecap="round"/>

  <text x="32" y="370" font-family="Georgia, serif" font-size="12" fill="#5a6573">Classic board: Front alone; Rear and Side share the rear tone.</text>
