  <text x="268" y="228" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#2e7d32">T2</text>

  <rect x="360" y="145" width="110" height="110" rx="4" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="415" y="134" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#1c2430">3-Way B</text>
  <circle cx="450" cy="200" r="4" fill="#1c2430"/>
  <circle cx="380" cy="175" r="4" fill="#1c2430"/>
