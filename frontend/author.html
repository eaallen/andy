<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andy — Create lab from diagram image</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html,
      body {
        overflow: auto;
        height: auto;
        background: #f4f4f5;
      }
      .author {
        max-width: 960px;
        margin: 0 auto;
        padding: 1.25rem;
        display: grid;
        gap: 1rem;
      }
      .author header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.75rem 1.25rem;
      }
      .author header a {
        color: #2563eb;
      }
      .panel {
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 1rem;
        background: #fff;
      }
      .row {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      input[type="text"],
      textarea,
      input[type="file"] {
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 6rem;
        font: inherit;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        cursor: pointer;
        border: 1px solid #111827;
        background: #111827;
        color: #fff;
        border-radius: 8px;
        padding: 0.55rem 0.9rem;
        font: inherit;
      }
      button.secondary {
        background: #fff;
        color: #111827;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        font-size: 0.9rem;
        color: #374151;
      }
      .status.error {
        color: #b91c1c;
      }
      .preview {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 800px) {
        .preview {
          grid-template-columns: 280px 1fr;
        }
      }
      .preview img {
        max-width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #f9fafb;
      }
      pre.yaml {
        margin: 0;
        padding: 0.75rem;
        overflow: auto;
        max-height: 420px;
        background: #0b1020;
        color: #e5e7eb;
        border-radius: 8px;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      ul.warnings {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
        color: #92400e;
      }
      .meta {
        font-size: 0.85rem;
        color: #6b7280;
      }
      .lab-mount {
        width: 100%;
        height: 520px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <main class="author">
      <header>
        <h1>Create lab from image</h1>
        <a href="/">← Back to labs</a>
      </header>

      <section class="panel">
        <p>
          Upload a photo or screenshot of a wiring diagram. The Andy server uses
          Gemini or Meta to draft an Andy lab YAML you can open in the circuit lab.
        </p>
        <form id="form">
          <div class="row">
            <label for="image">Diagram image</label>
            <input id="image" name="image" type="file" accept="image/*" required />
          </div>
          <div class="row">
            <label for="title">Title hint (optional)</label>
            <input id="title" name="title" type="text" placeholder="e.g. Three-way hallway lights" />
          </div>
          <div class="row">
            <label for="notes">Instructor notes (optional)</label>
            <textarea
              id="notes"
              name="notes"
              placeholder="Anything the model should know — shared neutrals, Front owns its own chime, etc."
            ></textarea>
          </div>
          <div class="actions">
            <button type="submit" id="submit">Generate YAML</button>
            <button type="button" class="secondary" id="copy" disabled>Copy YAML</button>
            <button type="button" class="secondary" id="openLab" disabled>Open in lab</button>
            <span class="status" id="status"></span>
          </div>
        </form>
      </section>

      <section class="panel preview" id="result" hidden>
        <div>
          <h2>Source image</h2>
          <img id="thumb" alt="Uploaded diagram preview" />
          <p class="meta" id="meta"></p>
          <ul class="warnings" id="warnings"></ul>
        </div>
        <div>
          <h2>Generated YAML</h2>
          <pre class="yaml" id="yaml"></pre>
        </div>
      </section>

      <section class="panel" id="demoPreview" hidden>
        <h2>Demo preview</h2>
        <div class="lab-mount" id="labMount"></div>
      </section>
    </main>

    <script type="module">
      import { mountCircuitLab } from "./js/circuit-lab.js";

      const form = document.getElementById("form");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      const copyBtn = document.getElementById("copy");
      const openBtn = document.getElementById("openLab");
      const resultEl = document.getElementById("result");
      const demoPreviewEl = document.getElementById("demoPreview");
      const labMountEl = document.getElementById("labMount");
      const yamlEl = document.getElementById("yaml");
      const warningsEl = document.getElementById("warnings");
      const metaEl = document.getElementById("meta");
      const thumbEl = document.getElementById("thumb");

      let lastYaml = "";
      let thumbObjectUrl = "";
      let statusBase = "";
      let statusStartedAt = 0;
      let statusTimer = null;
      const imageInput = document.getElementById("image");

      /**
       * Mounts an interactive Demo circuit from generated YAML into the preview panel.
       * @param {string} yaml - Andy lab YAML source.
       */
      function renderDemoPreview(yaml) {
        labMountEl.replaceChildren();
        if (!yaml.trim()) {
          demoPreviewEl.hidden = true;
          return;
        }

        const pre = document.createElement("pre");
        pre.className = "circuit-lab";
        pre.setAttribute("height", "100%");
        const code = document.createElement("code");
        code.textContent = yaml;
        pre.appendChild(code);
        labMountEl.appendChild(pre);
        demoPreviewEl.hidden = false;
        mountCircuitLab(pre);
      }

      /**
       * Clears generated YAML, warnings, and demo preview after a new image is chosen.
       */
      function resetGeneratedResult() {
        lastYaml = "";
        yamlEl.textContent = "";
        metaEl.textContent = "";
        warningsEl.replaceChildren();
        renderDemoPreview("");
        copyBtn.disabled = true;
        openBtn.disabled = true;
      }

      /**
       * Shows a local preview of the selected diagram image and resets prior YAML.
       * @param {File | null | undefined} file - Selected image file from the input.
       */
      function previewSelectedImage(file) {
        if (thumbObjectUrl) {
          URL.revokeObjectURL(thumbObjectUrl);
          thumbObjectUrl = "";
        }
        resetGeneratedResult();
        if (!(file instanceof File) || !file.type.startsWith("image/")) {
          thumbEl.removeAttribute("src");
          resultEl.hidden = true;
          return;
        }
        thumbObjectUrl = URL.createObjectURL(file);
        thumbEl.src = thumbObjectUrl;
        resultEl.hidden = false;
        finishStatus("");
      }

      /**
       * Updates the status line and starts/refreshes the elapsed-seconds timer.
       * @param {string} message - Status text without elapsed suffix.
       */
      function setStatus(message) {
        statusBase = message;
        if (!statusTimer) {
          statusStartedAt = Date.now();
          statusTimer = setInterval(() => {
            const secs = Math.max(
              0,
              Math.round((Date.now() - statusStartedAt) / 1000),
            );
            statusEl.textContent = statusBase
              ? `${statusBase} (${secs}s)`
              : "";
          }, 1000);
        }
        const secs = Math.max(
          0,
          Math.round((Date.now() - statusStartedAt) / 1000),
        );
        statusEl.textContent = `${message} (${secs}s)`;
      }

      /**
       * Stops the elapsed timer and sets a final status (no seconds suffix).
       * @param {string} message - Final status text.
       * @param {boolean} [isError] - When true, styles as error.
       */
      function finishStatus(message, isError) {
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
        statusBase = "";
        statusEl.classList.toggle("error", Boolean(isError));
        statusEl.textContent = message;
      }

      /**
       * Reads an SSE response body and invokes handlers for named events.
       * @param {Response} response - Fetch response with text/event-stream body.
       * @param {{ onProgress?: (data: { message?: string }) => void, onResult?: (data: Record<string, unknown>) => void, onError?: (data: { error?: string }) => void }} handlers
       */
      async function consumeSse(response, handlers) {
        if (!response.body) {
          throw new Error("No response body from server.");
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const chunk of chunks) {
            if (!chunk.trim() || chunk.startsWith(":")) continue;
            let eventName = "message";
            const dataLines = [];
            for (const line of chunk.split("\n")) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trim());
              }
            }
            if (!dataLines.length) continue;
            let data;
            try {
              data = JSON.parse(dataLines.join("\n"));
            } catch {
              continue;
            }
            if (eventName === "progress") handlers.onProgress?.(data);
            else if (eventName === "result") handlers.onResult?.(data);
            else if (eventName === "error") handlers.onError?.(data);
          }
        }
      }

      imageInput.addEventListener("change", () => {
        const file = imageInput.files?.[0];
        previewSelectedImage(file);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.classList.remove("error");
        setStatus("Uploading image…");
        submitBtn.disabled = true;
        copyBtn.disabled = true;
        openBtn.disabled = true;

        const fd = new FormData(form);

        try {
          const res = await fetch("/api/diagrams/from-image?stream=1", {
            method: "POST",
            headers: { Accept: "text/event-stream" },
            body: fd,
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || res.statusText);
          }

          /** @type {Record<string, unknown> | null} */
          let result = null;
          /** @type {string | null} */
          let streamError = null;

          await consumeSse(res, {
            onProgress: (data) => {
              if (data?.message) setStatus(String(data.message));
            },
            onResult: (data) => {
              result = data;
            },
            onError: (data) => {
              streamError = data?.error
                ? String(data.error)
                : "Generation failed.";
            },
          });

          if (streamError) {
            throw new Error(streamError);
          }
          if (!result) {
            throw new Error("Server closed the stream without a result.");
          }

          lastYaml = String(result.yaml || "");
          yamlEl.textContent = lastYaml;
          metaEl.textContent = `provider: ${result.provider} · model: ${result.model}`;
          warningsEl.innerHTML = "";
          for (const warning of result.warnings || []) {
            const li = document.createElement("li");
            li.textContent = String(warning);
            warningsEl.appendChild(li);
          }
          resultEl.hidden = false;
          renderDemoPreview(lastYaml);
          copyBtn.disabled = !lastYaml;
          openBtn.disabled = !lastYaml;
          finishStatus("Done.");
        } catch (err) {
          finishStatus(
            err instanceof Error ? err.message : String(err),
            true,
          );
        } finally {
          submitBtn.disabled = false;
        }
      });

      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(lastYaml);
        finishStatus("YAML copied.");
      });

      openBtn.addEventListener("click", () => {
        // Stash YAML for the main app to pick up via sessionStorage.
        sessionStorage.setItem("andy:draftLabYaml", lastYaml);
        window.location.href = "/?lab=draft";
      });
    </script>
  </body>
</html>
