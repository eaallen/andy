<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andre — Create lab from diagram image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      :root {
        --ink: #15202b;
        --muted: #5b6b7c;
        --line: #c9d4df;
        --surface: #ffffffcc;
        --accent: #0f766e;
        --accent-ink: #fff;
        --danger: #b42318;
        --warn: #9a6700;
        --code-bg: #101820;
        --code-fg: #e8eef4;
        --page: #e8eef2;
      }

      html {
        height: auto;
        min-height: 100%;
        background: var(--page);
      }

      body {
        position: relative;
        overflow: auto;
        height: auto;
        min-height: 100dvh;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background: transparent;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse 70vw 40vh at 8% 0%, #d7e8e4 0%, transparent 70%),
          radial-gradient(ellipse 60vw 36vh at 100% 0%, #d4e0ec 0%, transparent 70%),
          linear-gradient(180deg, #eef3f6 0%, var(--page) 45%, var(--page) 100%);
      }

      .author {
        --pad: clamp(1rem, 3vw, 1.75rem);
        max-width: 920px;
        margin: 0 auto;
        padding: var(--pad) var(--pad) 3rem;
        display: grid;
        gap: 1.5rem;
      }

      .author-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem 1rem;
      }

      .brand {
        display: grid;
        gap: 0.2rem;
      }

      .brand-mark {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 1.85rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .brand p {
        margin: 0.35rem 0 0;
        color: var(--muted);
        max-width: 38rem;
        line-height: 1.45;
      }

      .back {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
      }

      .back:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      .drop {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 180px;
        padding: 1.25rem;
        border: 1.5px dashed var(--line);
        border-radius: 12px;
        background: var(--surface);
        backdrop-filter: blur(6px);
        cursor: pointer;
        transition:
          border-color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .drop:hover,
      .drop:focus-within,
      .drop.is-drag {
        border-color: var(--accent);
        background: #ffffffee;
      }

      .drop.is-drag {
        transform: scale(1.01);
      }

      .drop.has-file {
        min-height: 0;
        padding: 0.75rem;
        border-style: solid;
        cursor: default;
      }

      .drop input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .drop.has-file input[type="file"] {
        inset: auto;
        top: 0.75rem;
        right: 0.75rem;
        width: 7.5rem;
        height: 2rem;
        opacity: 0;
      }

      .drop-empty {
        text-align: center;
        pointer-events: none;
      }

      .drop-empty strong {
        display: block;
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .drop-empty span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .drop.has-file .drop-empty {
        display: none;
      }

      .drop-preview {
        display: none;
        width: 100%;
        gap: 0.75rem;
        align-items: start;
      }

      .drop.has-file .drop-preview {
        display: grid;
        grid-template-columns: minmax(140px, 220px) 1fr;
      }

      @media (max-width: 640px) {
        .drop.has-file .drop-preview {
          grid-template-columns: 1fr;
        }
      }

      .drop-preview img {
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        border-radius: 8px;
        background: #f3f6f8;
      }

      .drop-meta {
        display: grid;
        gap: 0.35rem;
        align-content: start;
        padding-top: 0.15rem;
      }

      .drop-meta strong {
        font-weight: 600;
        word-break: break-all;
      }

      .drop-meta span,
      .change-file {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .change-file {
        justify-self: start;
        margin-top: 0.35rem;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 6px;
        padding: 0.35rem 0.65rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        pointer-events: none;
      }

      .hints {
        margin: 0;
        padding: 0.9rem 1rem;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        backdrop-filter: blur(6px);
        transition: border-color 160ms ease, background 160ms ease;
      }

      .hints:hover,
      .hints:focus-within {
        border-color: var(--accent);
        background: #ffffffee;
      }

      .hints summary {
        cursor: pointer;
        color: var(--ink);
        font-size: 0.98rem;
        font-weight: 600;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.35rem 0.65rem;
      }

      .hints summary::-webkit-details-marker {
        display: none;
      }

      .hints summary::before {
        content: "+";
        display: inline-grid;
        place-items: center;
        width: 1.35rem;
        height: 1.35rem;
        flex-shrink: 0;
        border-radius: 6px;
        background: #d7e8e4;
        color: var(--accent);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1;
      }

      .hints[open] summary::before {
        content: "–";
      }

      .hints summary .hint-note {
        flex-basis: 100%;
        margin: 0.15rem 0 0;
        padding-left: 2rem;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 400;
        line-height: 1.4;
      }

      .hints-fields {
        display: grid;
        gap: 0.85rem;
        margin-top: 0.9rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--line);
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
      }

      input[type="text"],
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
        outline-offset: 1px;
        border-color: var(--accent);
      }

      textarea {
        min-height: 4.5rem;
        resize: vertical;
      }

      #form {
        display: grid;
        gap: 1.5rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem 0.85rem;
      }

      button {
        font: inherit;
        font-weight: 500;
        border-radius: 8px;
        padding: 0.6rem 1rem;
        cursor: pointer;
        border: 1px solid transparent;
      }

      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
      }

      button.primary:hover:not(:disabled) {
        filter: brightness(1.05);
      }

      button.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--ink);
      }

      button.ghost:hover:not(:disabled) {
        background: #fff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .result {
        display: none;
        gap: 0.75rem;
      }

      .result.is-visible {
        display: grid;
      }

      .result-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 1rem;
      }

      .result-head h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      pre.yaml {
        margin: 0;
        padding: 0.9rem 1rem;
        overflow: auto;
        max-height: 420px;
        min-height: 8rem;
        background: var(--code-bg);
        color: var(--code-fg);
        border-radius: 10px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        line-height: 1.45;
      }

      pre.yaml:empty::before {
        content: "YAML will appear here after generation.";
        color: #8b9aab;
      }

      .meta {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      ul.warnings {
        margin: 0;
        padding-left: 1.1rem;
        color: var(--warn);
        font-size: 0.9rem;
      }

      .demo {
        display: none;
        gap: 0.65rem;
      }

      .demo.is-visible {
        display: grid;
      }

      .demo h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      .lab-mount {
        width: 100%;
        height: 520px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #fafbfc;
      }
    </style>
  </head>
  <body>
    <main class="author">
      <header class="author-top">
        <div class="brand">
          <div class="brand-mark">Andre</div>
          <h1>Create lab from image</h1>
          <p>
            Drop a wiring diagram. Andre drafts lab YAML you can open in the
            circuit lab.
          </p>
        </div>
        <a class="back" href="/">← Labs</a>
      </header>

      <form id="form">
        <label class="drop" id="drop" for="image">
          <input id="image" name="image" type="file" accept="image/*" required />
          <div class="drop-empty">
            <strong>Drop a diagram image</strong>
            <span>or click to browse · PNG, JPG, WebP</span>
          </div>
          <div class="drop-preview">
            <img id="thumb" alt="Uploaded diagram preview" />
            <div class="drop-meta">
              <strong id="fileName"></strong>
              <span id="fileInfo"></span>
              <span class="change-file">Change image</span>
            </div>
          </div>
        </label>

        <details class="hints">
          <summary>
            Optional hints for the model
            <span class="hint-note"
              >Title and instructor notes help the model match your diagram.</span
            >
          </summary>
          <div class="hints-fields">
            <label>
              Title hint
              <input
                id="title"
                name="title"
                type="text"
                placeholder="e.g. Three-way hallway lights"
              />
            </label>
            <label>
              Instructor notes
              <textarea
                id="notes"
                name="notes"
                placeholder="Shared neutrals, Front owns its own chime, etc."
              ></textarea>
            </label>
          </div>
        </details>

        <div class="actions">
          <button type="submit" class="primary" id="submit">Generate YAML</button>
          <span class="status" id="status"></span>
        </div>
      </form>

      <section class="result" id="result" aria-live="polite">
        <div class="result-head">
          <h2>Generated YAML</h2>
          <div class="result-actions">
            <button type="button" class="ghost" id="copy" disabled>Copy</button>
            <button type="button" class="ghost" id="openLab" disabled>Open in lab</button>
          </div>
        </div>
        <p class="meta" id="meta"></p>
        <ul class="warnings" id="warnings"></ul>
        <pre class="yaml" id="yaml"></pre>
      </section>

      <section class="demo" id="demoPreview">
        <h2>Demo preview</h2>
        <div class="lab-mount" id="labMount"></div>
      </section>
    </main>

    <script type="module">
      import { mountCircuitLab } from "./js/circuit-lab.js";

      const form = document.getElementById("form");
      const dropEl = document.getElementById("drop");
      const imageInput = document.getElementById("image");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      const copyBtn = document.getElementById("copy");
      const openBtn = document.getElementById("openLab");
      const resultEl = document.getElementById("result");
      const demoPreviewEl = document.getElementById("demoPreview");
      const labMountEl = document.getElementById("labMount");
      const yamlEl = document.getElementById("yaml");
      const warningsEl = document.getElementById("warnings");
      const metaEl = document.getElementById("meta");
      const thumbEl = document.getElementById("thumb");
      const fileNameEl = document.getElementById("fileName");
      const fileInfoEl = document.getElementById("fileInfo");

      let lastYaml = "";
      let thumbObjectUrl = "";
      let statusBase = "";
      let statusStartedAt = 0;
      let statusTimer = null;

      /**
       * Formats a byte size for the file info line.
       * @param {number} bytes - File size in bytes.
       */
      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      /**
       * Mounts an interactive Demo circuit from generated YAML into the preview panel.
       * @param {string} yaml - Andre lab YAML source.
       */
      function renderDemoPreview(yaml) {
        labMountEl.replaceChildren();
        if (!yaml.trim()) {
          demoPreviewEl.classList.remove("is-visible");
          return;
        }

        const pre = document.createElement("pre");
        pre.className = "circuit-lab";
        pre.setAttribute("height", "100%");
        const code = document.createElement("code");
        code.textContent = yaml;
        pre.appendChild(code);
        labMountEl.appendChild(pre);
        demoPreviewEl.classList.add("is-visible");
        mountCircuitLab(pre);
      }

      /**
       * Clears generated YAML, warnings, and demo preview after a new image is chosen.
       */
      function resetGeneratedResult() {
        lastYaml = "";
        yamlEl.textContent = "";
        metaEl.textContent = "";
        warningsEl.replaceChildren();
        renderDemoPreview("");
        copyBtn.disabled = true;
        openBtn.disabled = true;
      }

      /**
       * Shows a local preview of the selected diagram image and resets prior YAML.
       * @param {File | null | undefined} file - Selected image file from the input.
       */
      function previewSelectedImage(file) {
        if (thumbObjectUrl) {
          URL.revokeObjectURL(thumbObjectUrl);
          thumbObjectUrl = "";
        }
        resetGeneratedResult();
        if (!(file instanceof File) || !file.type.startsWith("image/")) {
          thumbEl.removeAttribute("src");
          dropEl.classList.remove("has-file");
          resultEl.classList.remove("is-visible");
          fileNameEl.textContent = "";
          fileInfoEl.textContent = "";
          return;
        }
        thumbObjectUrl = URL.createObjectURL(file);
        thumbEl.src = thumbObjectUrl;
        fileNameEl.textContent = file.name;
        fileInfoEl.textContent = `${formatBytes(file.size)} · ${file.type || "image"}`;
        dropEl.classList.add("has-file");
        resultEl.classList.add("is-visible");
        finishStatus("");
      }

      /**
       * Updates the status line and starts/refreshes the elapsed-seconds timer.
       * @param {string} message - Status text without elapsed suffix.
       */
      function setStatus(message) {
        statusBase = message;
        if (!statusTimer) {
          statusStartedAt = Date.now();
          statusTimer = setInterval(() => {
            const secs = Math.max(
              0,
              Math.round((Date.now() - statusStartedAt) / 1000),
            );
            statusEl.textContent = statusBase
              ? `${statusBase} (${secs}s)`
              : "";
          }, 1000);
        }
        const secs = Math.max(
          0,
          Math.round((Date.now() - statusStartedAt) / 1000),
        );
        statusEl.textContent = `${message} (${secs}s)`;
      }

      /**
       * Stops the elapsed timer and sets a final status (no seconds suffix).
       * @param {string} message - Final status text.
       * @param {boolean} [isError] - When true, styles as error.
       */
      function finishStatus(message, isError) {
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
        statusBase = "";
        statusEl.classList.toggle("error", Boolean(isError));
        statusEl.textContent = message;
      }

      /**
       * Reads an SSE response body and invokes handlers for named events.
       * @param {Response} response - Fetch response with text/event-stream body.
       * @param {{ onProgress?: (data: { message?: string }) => void, onResult?: (data: Record<string, unknown>) => void, onError?: (data: { error?: string }) => void }} handlers
       */
      async function consumeSse(response, handlers) {
        if (!response.body) {
          throw new Error("No response body from server.");
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const chunk of chunks) {
            if (!chunk.trim() || chunk.startsWith(":")) continue;
            let eventName = "message";
            const dataLines = [];
            for (const line of chunk.split("\n")) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trim());
              }
            }
            if (!dataLines.length) continue;
            let data;
            try {
              data = JSON.parse(dataLines.join("\n"));
            } catch {
              continue;
            }
            if (eventName === "progress") handlers.onProgress?.(data);
            else if (eventName === "result") handlers.onResult?.(data);
            else if (eventName === "error") handlers.onError?.(data);
          }
        }
      }

      imageInput.addEventListener("change", () => {
        previewSelectedImage(imageInput.files?.[0]);
      });

      ;["dragenter", "dragover"].forEach((eventName) => {
        dropEl.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropEl.classList.add("is-drag");
        });
      });

      ;["dragleave", "drop"].forEach((eventName) => {
        dropEl.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropEl.classList.remove("is-drag");
        });
      });

      dropEl.addEventListener("drop", (event) => {
        const file = event.dataTransfer?.files?.[0];
        if (!(file instanceof File)) return;
        const transfer = new DataTransfer();
        transfer.items.add(file);
        imageInput.files = transfer.files;
        previewSelectedImage(file);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.classList.remove("error");
        setStatus("Uploading image…");
        submitBtn.disabled = true;
        copyBtn.disabled = true;
        openBtn.disabled = true;

        const fd = new FormData(form);

        try {
          const res = await fetch("/api/diagrams/from-image?stream=1", {
            method: "POST",
            headers: { Accept: "text/event-stream" },
            body: fd,
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || res.statusText);
          }

          /** @type {Record<string, unknown> | null} */
          let result = null;
          /** @type {string | null} */
          let streamError = null;

          await consumeSse(res, {
            onProgress: (data) => {
              if (data?.message) setStatus(String(data.message));
            },
            onResult: (data) => {
              result = data;
            },
            onError: (data) => {
              streamError = data?.error
                ? String(data.error)
                : "Generation failed.";
            },
          });

          if (streamError) {
            throw new Error(streamError);
          }
          if (!result) {
            throw new Error("Server closed the stream without a result.");
          }

          lastYaml = String(result.yaml || "");
          yamlEl.textContent = lastYaml;
          metaEl.textContent = `${result.provider} · ${result.model}`;
          warningsEl.replaceChildren();
          for (const warning of result.warnings || []) {
            const li = document.createElement("li");
            li.textContent = String(warning);
            warningsEl.appendChild(li);
          }
          resultEl.classList.add("is-visible");
          renderDemoPreview(lastYaml);
          copyBtn.disabled = !lastYaml;
          openBtn.disabled = !lastYaml;
          finishStatus("Done.");
        } catch (err) {
          finishStatus(
            err instanceof Error ? err.message : String(err),
            true,
          );
        } finally {
          submitBtn.disabled = false;
        }
      });

      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(lastYaml);
        finishStatus("YAML copied.");
      });

      openBtn.addEventListener("click", () => {
        sessionStorage.setItem("Andre:draftLabYaml", lastYaml);
        window.location.href = "/?lab=draft";
      });
    </script>
  </body>
</html>
